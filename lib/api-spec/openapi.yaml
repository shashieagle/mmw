openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: monkmonkeyworks video portfolio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: videos
    description: Video portfolio operations
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List all videos
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
          description: Filter featured videos only
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Create a new video entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoBody"
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a video by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateVideo
      tags: [videos]
      summary: Update a video entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoBody"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /videos/stats/summary:
    get:
      operationId: getVideoStats
      tags: [videos]
      summary: Get portfolio stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoStats"

  /videos/categories:
    get:
      operationId: listCategories
      tags: [videos]
      summary: List all unique video categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /images:
    get:
      operationId: listStudioImages
      tags: [images]
      summary: List all studio images
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioImage"
    post:
      operationId: createStudioImage
      tags: [images]
      summary: Create a new studio image entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudioImageBody"
      responses:
        "201":
          description: Image created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioImage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /images/{id}:
    delete:
      operationId: deleteStudioImage
      tags: [images]
      summary: Delete a studio image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /images/categories:
    get:
      operationId: listImageCategories
      tags: [images]
      summary: List all unique image categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Video:
      type: object
      required: [id, title, description, videoPath, thumbnailPath, category, featured, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        videoPath:
          type: string
          description: Object path for the video file
        thumbnailPath:
          type: ["string", "null"]
          description: Object path for the thumbnail image
        category:
          type: string
        format:
          type: ["string", "null"]
          description: Primary format label shown on cards and filter bar (e.g. "Commercial Ad")
        orientation:
          type: string
          enum: [landscape, portrait]
          default: landscape
          description: Card aspect ratio — landscape (16:9) or portrait (9:16)
        featured:
          type: boolean
        duration:
          type: ["string", "null"]
          description: Human-readable duration (e.g. "2:34")
        year:
          type: ["integer", "null"]
        director:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    CreateVideoBody:
      type: object
      required: [title, description, videoPath, category]
      properties:
        title:
          type: string
        description:
          type: string
        videoPath:
          type: string
        thumbnailPath:
          type: ["string", "null"]
        category:
          type: string
        format:
          type: ["string", "null"]
        orientation:
          type: string
          enum: [landscape, portrait]
          default: landscape
        featured:
          type: boolean
          default: false
        duration:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        director:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string

    UpdateVideoBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        videoPath:
          type: string
        thumbnailPath:
          type: ["string", "null"]
        category:
          type: string
        format:
          type: ["string", "null"]
        orientation:
          type: string
          enum: [landscape, portrait]
        featured:
          type: boolean
        duration:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        director:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string

    VideoStats:
      type: object
      required: [totalVideos, totalCategories, featuredCount]
      properties:
        totalVideos:
          type: integer
        totalCategories:
          type: integer
        featuredCount:
          type: integer
        categoryBreakdown:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    StudioImage:
      type: object
      required: [id, imagePath, category, createdAt]
      properties:
        id:
          type: integer
        imagePath:
          type: string
        category:
          type: string
        caption:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CreateStudioImageBody:
      type: object
      required: [imagePath, category]
      properties:
        imagePath:
          type: string
        category:
          type: string
        caption:
          type: ["string", "null"]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
